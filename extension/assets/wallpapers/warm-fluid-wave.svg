<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140727"/>
      <stop offset="45%" stop-color="#2d124d"/>
      <stop offset="100%" stop-color="#0b0314"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#9a1c49" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wave2" x1="20%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="wave3" x1="10%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#be185d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#140727" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Ambient Radiant Glow -->
  <circle cx="1250" cy="380" r="600" fill="url(#glow)"/>

  <!-- Layer 1: Deep Plum Wave -->
  <path d="M-100,550 C300,420 600,780 1050,620 C1500,460 1750,720 2050,580 L2050,1200 L-100,1200 Z" fill="url(#wave1)"/>

  <!-- Layer 2: Warm Fluid Crimson/Magenta Wave with Blur -->
  <path d="M-50,680 C350,520 700,900 1200,680 C1650,480 1850,750 2000,640 L2000,1200 L-50,1200 Z" fill="url(#wave3)" filter="url(#soft-blur)"/>

  <!-- Layer 3: Vibrant Amber Fluid Curve -->
  <path d="M-100,820 C250,650 650,980 1150,740 C1550,540 1800,840 2050,720 L2050,1200 L-100,1200 Z" fill="url(#wave2)"/>
</svg>
