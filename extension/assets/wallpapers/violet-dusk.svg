<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c071e"/>
      <stop offset="50%" stop-color="#1f0a38"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>
    <radialGradient id="twilight-glow" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#db2777" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#0c071e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#831843" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="curve2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#c026d3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Twilight Base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Atmospheric Radiant Violet/Rose Glow -->
  <circle cx="760" cy="420" r="750" fill="url(#twilight-glow)"/>

  <!-- Gentle Landscape Curves -->
  <path d="M-100,640 C400,500 800,800 1300,580 C1700,420 1850,680 2050,560 L2050,1200 L-100,1200 Z" fill="url(#curve1)"/>
  <path d="M-50,780 C350,660 750,960 1200,740 C1600,560 1850,820 2050,700 L2050,1200 L-50,1200 Z" fill="url(#curve2)"/>
</svg>
