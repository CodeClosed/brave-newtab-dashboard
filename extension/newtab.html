<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <!-- Synchronous blocking theme script to eliminate Flash of Wrong Theme (FOWT) -->
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/components/dialogs.css">
  <link rel="stylesheet" href="css/components/toasts.css">
  <link rel="stylesheet" href="css/components/drawer.css">
</head>
<body data-page="classic">
  <!-- Optional custom background overlay container -->
  <div id="bg-overlay" aria-hidden="true"></div>

  <!-- Omnidirectional Floating App Dock (Pinned items) -->
  <nav id="app-dock" class="app-dock" data-position="top" aria-label="Quick launch" hidden></nav>

  <!-- Top-right utility navigation -->
  <nav class="top-nav" aria-label="Quick actions">
    <button id="edit-mode-toggle-btn" class="nav-icon-btn" type="button" aria-pressed="false" aria-label="Toggle edit mode" title="Edit mode (e)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
    </button>
    <button id="settings-trigger-btn" class="nav-icon-btn" type="button" aria-label="Open settings" title="Customize dashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </nav>

  <!-- Main App Shell -->
  <div id="app">
    <!-- Stage 1: Hero Panel (Clean, Uncluttered) -->
    <section id="hero-panel" class="hero-panel" data-hero-layout="studio" aria-label="Home">
      <header class="dashboard-header">
        <div id="clock-display" class="clock-display" aria-live="off"></div>
        <div class="date-greeting-row">
          <span id="greeting-display"></span>
          <span id="date-display"></span>
        </div>
        <div id="clock-second-tz" class="clock-second-tz" style="display: none;"></div>
        <div id="countdown-display" class="countdown-display" style="display: none;"></div>

        <!-- Space Switcher -->
        <nav id="space-switcher" class="space-switcher" aria-label="Spaces" hidden></nav>

        <!-- Search Field -->
        <section class="search-container" aria-label="Web search">
          <form id="search-form" class="search-form" method="get" action="https://www.google.com/search">
            <span class="search-icon-prefix" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input
              id="search-input"
              class="search-input"
              type="search"
              name="q"
              placeholder="Search the web..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Search query"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="search-results-list"
            >
            <kbd class="search-shortcut-badge" title="Press / to focus search">/</kbd>
            <ul id="search-results-list" class="search-results-list" role="listbox" aria-label="Search suggestions" hidden></ul>
          </form>
        </section>
      </header>

      <!-- Scroll prompt for Stage 2 (Two-stage layout) -->
      <button id="scroll-to-hub" class="scroll-prompt" type="button" aria-label="Scroll down for collections">
        <span>Scroll down for your collections</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </section>

    <!-- Stage 2: Collections Hub (Frosted glass windows below the fold) -->
    <main id="collections-hub" class="dashboard-main collections-hub" aria-label="Bookmark collections">
      <div class="hub-toolbar dashboard-toolbar">
        <button id="scroll-to-hero" class="scroll-to-top-btn btn-quiet" type="button" aria-label="Back to top" title="Scroll to top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
          <span>Top</span>
        </button>
        <button id="add-category-toolbar-btn" class="btn-quiet" type="button">
          <span>+</span>
          <span>New Collection</span>
        </button>
        <button id="collapse-all-btn" class="btn-quiet" type="button" title="Collapse all collections">
          <span>Collapse all</span>
        </button>
        <button id="expand-all-btn" class="btn-quiet" type="button" title="Expand all collections">
          <span>Expand all</span>
        </button>
      </div>
      <nav id="pinned-strip" class="pinned-strip" aria-label="Pinned bookmarks" hidden></nav>
      <section id="widgets-container" class="widgets-container" aria-label="Widgets" hidden>
        <div id="notes-widget-container"></div>
        <div id="todo-widget-container"></div>
      </section>
      <div id="categories-grid" class="categories-grid"></div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
